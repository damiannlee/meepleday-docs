openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
paths:
  /api/events:
    get:
      tags:
      - event-controller
      operationId: getFeed
      parameters:
      - name: region
        in: query
        required: false
        schema:
          type: string
          enum:
          - DOMESTIC
          - OVERSEAS
      - name: eventType
        in: query
        required: false
        schema:
          type: string
          enum:
          - FUNDING
          - PREORDER
          - SALE
          - OFFLINE_EVENT
      - name: platform
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - ANNOUNCED
          - UPCOMING
          - ONGOING
          - ENDING_SOON
          - ENDED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageEventResponse"
    post:
      tags:
      - event-controller
      operationId: submit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventSubmissionRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventResponse"
  /api/admin/events/{id}/moderation:
    patch:
      tags:
      - event-admin-controller
      operationId: moderate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventModerationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventResponse"
  /api/me:
    get:
      tags:
      - auth-controller
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/events/{id}:
    get:
      tags:
      - event-controller
      operationId: getEvent
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventResponse"
  /api/admin/events:
    get:
      tags:
      - event-admin-controller
      operationId: list
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: PENDING
          enum:
          - PENDING
          - PUBLISHED
          - REJECTED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageEventResponse"
components:
  schemas:
    EventSubmissionRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
          minLength: 0
        eventType:
          type: string
          enum:
          - FUNDING
          - PREORDER
          - SALE
          - OFFLINE_EVENT
        region:
          type: string
          enum:
          - DOMESTIC
          - OVERSEAS
        platform:
          type: string
          maxLength: 255
          minLength: 0
        originalUrl:
          type: string
          maxLength: 1000
          minLength: 0
        description:
          type: string
        coverImageUrl:
          type: string
          maxLength: 1000
          minLength: 0
        publisher:
          type: string
          maxLength: 255
          minLength: 0
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        scheduleNote:
          type: string
          maxLength: 255
          minLength: 0
        gameId:
          type: integer
          format: int64
        location:
          type: string
          maxLength: 255
          minLength: 0
        address:
          type: string
          maxLength: 500
          minLength: 0
        admissionFee:
          type: number
        reservationUrl:
          type: string
          maxLength: 1000
          minLength: 0
        submitterName:
          type: string
          maxLength: 255
          minLength: 0
        submitterEmail:
          type: string
          maxLength: 255
          minLength: 0
        website:
          type: string
          maxLength: 255
          minLength: 0
        isHoneypotTripped:
          type: boolean
      required:
      - eventType
      - isHoneypotTripped
      - originalUrl
      - platform
      - region
      - title
    EventResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        eventType:
          type: string
          enum:
          - FUNDING
          - PREORDER
          - SALE
          - OFFLINE_EVENT
        region:
          type: string
          enum:
          - DOMESTIC
          - OVERSEAS
        platform:
          type: string
        originalUrl:
          type: string
        description:
          type: string
        coverImageUrl:
          type: string
        publisher:
          type: string
        startAt:
          type: string
          format: date-time
        endAt:
          type: string
          format: date-time
        scheduleNote:
          type: string
        gameId:
          type: integer
          format: int64
        location:
          type: string
        address:
          type: string
        admissionFee:
          type: number
        reservationUrl:
          type: string
        status:
          type: string
          enum:
          - ANNOUNCED
          - UPCOMING
          - ONGOING
          - ENDING_SOON
          - ENDED
        moderationStatus:
          type: string
          enum:
          - PENDING
          - PUBLISHED
          - REJECTED
      required:
      - eventType
      - id
      - moderationStatus
      - originalUrl
      - platform
      - region
      - status
      - title
    EventModerationRequest:
      type: object
      properties:
        action:
          type: string
          enum:
          - PUBLISH
          - REJECT
        reason:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - action
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        provider:
          type: string
          enum:
          - KAKAO
          - GOOGLE
        email:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum:
          - USER
          - ADMIN
      required:
      - displayName
      - id
      - provider
      - role
    PageEventResponse:
      type: object
      properties:
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        pageable:
          $ref: "#/components/schemas/PageableObject"
        numberOfElements:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: "#/components/schemas/EventResponse"
        number:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        empty:
          type: boolean
    PageableObject:
      type: object
      properties:
        unpaged:
          type: boolean
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        offset:
          type: integer
          format: int64
        sort:
          $ref: "#/components/schemas/SortObject"
    SortObject:
      type: object
      properties:
        unsorted:
          type: boolean
        sorted:
          type: boolean
        empty:
          type: boolean
