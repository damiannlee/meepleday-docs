openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- description: Generated server url
  url: http://localhost:8080
paths:
  /api/admin/events:
    get:
      operationId: list
      parameters:
      - in: query
        name: status
        required: false
        schema:
          type: string
          default: PENDING
          enum:
          - PENDING
          - PUBLISHED
          - REJECTED
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageEventResponse"
          description: OK
      tags:
      - event-admin-controller
  /api/admin/events/{id}/moderation:
    patch:
      operationId: moderate
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventModerationRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: OK
      tags:
      - event-admin-controller
  /api/events:
    get:
      operationId: getFeed
      parameters:
      - in: query
        name: region
        required: false
        schema:
          type: string
          enum:
          - DOMESTIC
          - OVERSEAS
      - in: query
        name: eventType
        required: false
        schema:
          type: string
          enum:
          - FUNDING
          - PREORDER
          - SALE
          - OFFLINE_EVENT
          - RETAIL
      - in: query
        name: platform
        required: false
        schema:
          type: string
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - ANNOUNCED
          - UPCOMING
          - ONGOING
          - ENDING_SOON
          - ENDED
      - in: query
        name: q
        required: false
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageEventResponse"
          description: OK
      tags:
      - event-controller
    post:
      operationId: submit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventSubmissionRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: Created
      tags:
      - event-controller
  /api/events/prefill:
    post:
      operationId: prefill
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrefillRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PrefillResponse"
          description: OK
      tags:
      - prefill-controller
  /api/events/{eventId}/bookmark:
    delete:
      operationId: unbookmark
      parameters:
      - in: path
        name: eventId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
      tags:
      - bookmark-controller
    post:
      operationId: bookmark
      parameters:
      - in: path
        name: eventId
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BookmarkResponse"
          description: OK
      tags:
      - bookmark-controller
  /api/events/{id}:
    get:
      operationId: getEvent
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: OK
      tags:
      - event-controller
  /api/games/{id}:
    get:
      operationId: getGame
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GameDetailResponse"
          description: OK
      tags:
      - game-controller
  /api/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
      tags:
      - auth-controller
  /api/me/bookmarks:
    get:
      operationId: getMyBookmarks
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageBookmarkResponse"
          description: OK
      tags:
      - bookmark-controller
  /api/me/submissions:
    get:
      operationId: getMySubmissions
      parameters:
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageEventResponse"
          description: OK
      tags:
      - my-submissions-controller
components:
  schemas:
    BookmarkResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        event:
          $ref: "#/components/schemas/EventResponse"
        id:
          type: integer
          format: int64
      required:
      - createdAt
      - event
      - id
    EventModerationRequest:
      type: object
      properties:
        action:
          type: string
          enum:
          - PUBLISH
          - REJECT
        reason:
          type: string
          maxLength: 500
          minLength: 0
      required:
      - action
    EventResponse:
      type: object
      properties:
        address:
          type: string
        admissionFee:
          type: number
        coverImageUrl:
          type: string
        description:
          type: string
        endAt:
          type: string
          format: date-time
        eventType:
          type: string
          enum:
          - FUNDING
          - PREORDER
          - SALE
          - OFFLINE_EVENT
          - RETAIL
        gameId:
          type: integer
          format: int64
        id:
          type: integer
          format: int64
        location:
          type: string
        moderationStatus:
          type: string
          enum:
          - PENDING
          - PUBLISHED
          - REJECTED
        originalUrl:
          type: string
        platform:
          type: string
        publisher:
          type: string
        region:
          type: string
          enum:
          - DOMESTIC
          - OVERSEAS
        reservationUrl:
          type: string
        scheduleNote:
          type: string
        startAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - ANNOUNCED
          - UPCOMING
          - ONGOING
          - ENDING_SOON
          - ENDED
        title:
          type: string
      required:
      - eventType
      - id
      - moderationStatus
      - originalUrl
      - platform
      - region
      - status
      - title
    EventSubmissionRequest:
      type: object
      properties:
        address:
          type: string
          maxLength: 500
          minLength: 0
        admissionFee:
          type: number
        coverImageUrl:
          type: string
          maxLength: 1000
          minLength: 0
        description:
          type: string
        endAt:
          type: string
          format: date-time
        eventType:
          type: string
          enum:
          - FUNDING
          - PREORDER
          - SALE
          - OFFLINE_EVENT
          - RETAIL
        gameId:
          type: integer
          format: int64
        isHoneypotTripped:
          type: boolean
        location:
          type: string
          maxLength: 255
          minLength: 0
        originalUrl:
          type: string
          maxLength: 1000
          minLength: 0
        platform:
          type: string
          maxLength: 255
          minLength: 0
        publisher:
          type: string
          maxLength: 255
          minLength: 0
        region:
          type: string
          enum:
          - DOMESTIC
          - OVERSEAS
        reservationUrl:
          type: string
          maxLength: 1000
          minLength: 0
        scheduleNote:
          type: string
          maxLength: 255
          minLength: 0
        startAt:
          type: string
          format: date-time
        submitterEmail:
          type: string
          maxLength: 255
          minLength: 0
        submitterName:
          type: string
          maxLength: 255
          minLength: 0
        title:
          type: string
          maxLength: 255
          minLength: 0
        website:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - eventType
      - isHoneypotTripped
      - originalUrl
      - platform
      - region
      - title
    GameDetailResponse:
      type: object
      properties:
        bggId:
          type: integer
          format: int64
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventResponse"
        id:
          type: integer
          format: int64
        publisher:
          type: string
        titleKo:
          type: string
        titleOriginal:
          type: string
      required:
      - events
      - id
      - titleOriginal
    PageBookmarkResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/BookmarkResponse"
        empty:
          type: boolean
        first:
          type: boolean
        last:
          type: boolean
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        size:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageEventResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/EventResponse"
        empty:
          type: boolean
        first:
          type: boolean
        last:
          type: boolean
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        size:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        paged:
          type: boolean
        sort:
          $ref: "#/components/schemas/SortObject"
        unpaged:
          type: boolean
    PrefillRequest:
      type: object
      properties:
        url:
          type: string
          maxLength: 2048
          minLength: 0
          pattern: ^https?://.+
      required:
      - url
    PrefillResponse:
      type: object
      properties:
        coverImageUrl:
          type: string
        description:
          type: string
        originalUrl:
          type: string
        title:
          type: string
      required:
      - originalUrl
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    UserResponse:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
        id:
          type: integer
          format: int64
        provider:
          type: string
          enum:
          - KAKAO
          - GOOGLE
        role:
          type: string
          enum:
          - USER
          - ADMIN
      required:
      - displayName
      - id
      - provider
      - role
